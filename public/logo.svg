<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="zivo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="zivo-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="26" fill="#0f172a" />
  <rect x="2" y="2" width="96" height="96" rx="24" stroke="url(#zivo-grad)" stroke-width="2" stroke-opacity="0.5" />
  <g filter="url(#shadow)">
    <!-- Stylized Z geometric path with modern tech aesthetic -->
    <path d="M 26 30 L 72 30 C 74.2 30 75.5 32.5 74.2 34.3 L 42 70 L 74 70" 
          stroke="url(#zivo-glow)" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Center AI nexus node -->
    <circle cx="50" cy="50" r="4.5" fill="#38bdf8" />
    <circle cx="72" cy="30" r="3" fill="#ffffff" />
    <circle cx="28" cy="70" r="3" fill="#ffffff" />
  </g>
</svg>
